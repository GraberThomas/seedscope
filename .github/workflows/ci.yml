name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Syntaxe JavaScript
        run: |
          for file in seedscope/static/*.js; do
            cp "$file" "/tmp/$(basename "$file" .js).mjs"
            node --check "/tmp/$(basename "$file" .js).mjs"
          done
      - name: Image Docker
        run: docker build -t seedscope:ci .
